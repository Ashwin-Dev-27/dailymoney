name: dailymoney
description: DailyMoney — Smart Personal Finance Tracker
publish_to: 'none'
version: 1.3.1+8

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Charts
  fl_chart: ^0.70.2

  # Icons (maintained lucide fork; original lucide_icons is broken on Flutter 3.47)
  lucide_icons_flutter: ^4.0.1

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.2

  # Date/number formatting
  intl: ^0.19.0

  # UUID generation for transactions
  uuid: ^4.5.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Security: encrypted local storage and biometric unlock
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  local_auth: ^2.3.0

  # Date parsing for imported bank statements
  csv: ^6.0.0

  # Lightweight audio playback for UI sound effects
  audioplayers: ^6.1.0

  # Opening email/phone/WhatsApp links
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
